output:
  export_dir: data/exports
  filename_pattern: bookmark-{timestamp}.html
  excel_dir: data/exports
  html_dir: data/exports
  log_dir: data/logs
  log_level: INFO
  # T5.3 导出包含选项默认值（导出对话框可临时勾选）
  export_include_dead: false    # 失效链接默认排除
  export_include_local: true    # 本地/内网默认包含
ui:
  theme: light
  language: zh_CN
  window_width: 1200
  window_height: 800
