browser:
  type: auto
  chrome_profiles: []
  edge_profiles: []
proxy:
  enabled: true
  auto_detect_system: true
  custom:
    enabled: true
    type: http
    host: 127.0.0.1
    port: 7890
    username: ''
    password: ''
  use_for:
    web_fetch: true
    ai_api: false
    firecrawl: true
  bypass_domains:
  - apihub.agnes-ai.com
  - localhost
  - 127.0.0.1
ai:
  provider: deepseek
  model: agnes-2.0-flash
  base_url: https://apihub.agnes-ai.com/v1
  timeout: 30
  max_retries: 3
  concurrency: 3
  batch_size: 5
  max_cost_yuan: 5.0
firecrawl:
  enabled: true
  api_url: https://api.firecrawl.dev/v1
  timeout: 30
fetch:
  engine: scrapling
  timeout: 10
  max_retries: 2
  concurrency: 5
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
  fallback_to_firecrawl: true
classification:
  ai_enabled: true
  ai_confidence_threshold: 0.5
  cache_enabled: true
  cache_dir: data/cache
  allow_delete: true
  confirm_delete: true
# 分类由 AI 自动生成（方案 A：全程自动化），无需维护分类/关键词配置
categories: []
output:
  export_dir: data/exports
  filename_pattern: bookmark-{timestamp}.html
  excel_dir: data/exports
  html_dir: data/exports
  log_dir: data/logs
  log_level: INFO
  # T5.3 导出包含选项默认值（导出对话框可临时勾选）
  export_include_dead: false    # 失效链接默认排除
  export_include_local: true    # 本地/内网默认包含
ui:
  theme: light
  language: zh_CN
  window_width: 1200
  window_height: 800
